<mat-toolbar class="toolbar">
  @if (isMobile()) {
    <button matIconButton type="button" aria-label="פתיחת תפריט" (click)="sidenav.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
  }
  <mat-icon class="logo" aria-hidden="true">rule</mat-icon>
  <span class="title">בקרות נתונים</span>
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav
    #sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
    class="sidenav"
  >
    <mat-nav-list aria-label="ניווט ראשי">
      @for (item of navItems; track item.link) {
        <a
          mat-list-item
          [routerLink]="item.link"
          routerLinkActive
          #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          [activated]="rla.isActive"
          (click)="closeIfMobile()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <main>
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
